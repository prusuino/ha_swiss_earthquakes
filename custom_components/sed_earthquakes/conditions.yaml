recent_earthquake:
  fields:
    behavior:
      required: true
      default: any
      selector:
        automation_behavior:
          mode: condition
    for:
      required: true
      default: 00:00:00
      selector:
        duration:
    hours:
      required: false
      default: 24
      example: 24
      selector:
        number:
          min: 0.1
          max: 720
          step: any
          mode: box
    minimum_magnitude:
      required: false
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
  target:
    entity:
      - integration: sed_earthquakes
        domain: sensor
        device_class: timestamp
