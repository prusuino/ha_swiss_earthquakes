blueprint:
  name: Swiss Earthquakes – notify on an earthquake
  description: >-
    Sends a notification to your phone when the Swiss Seismological Service
    records a new earthquake within the radius of one of your locations and
    its magnitude reaches the minimum you set: place, magnitude, depth,
    distance and time.


    Add your own steps in the action field, for example a text-to-speech
    announcement; the text is available there as `{{ message }}`.
  domain: automation
  source_url: https://github.com/prusuino/ha_swiss_earthquakes/blob/main/blueprints/automation/earthquake_notification.yaml
  author: prusuino
  homeassistant:
    min_version: 2025.4.0
  input:
    latest_sensors:
      name: Latest-earthquake sensors
      description: The latest-earthquake sensor of each location you want to be told about.
      selector:
        entity:
          multiple: true
          filter:
            - integration: sed_earthquakes
              domain: sensor
              device_class: timestamp
    minimum_magnitude:
      name: Minimum magnitude
      description: Only earthquakes at least this strong are reported. Switzerland records dozens of events below magnitude 2 every month.
      default: 2.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: slider
    notify_device:
      name: Phone
      description: The phone (Home Assistant Companion app) that receives the notification.
      selector:
        device:
          filter:
            - integration: mobile_app
    extra_actions:
      name: Additional actions
      description: Run after the notification. The notification text is available as `{{ message }}`.
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input latest_sensors
    not_to:
      - unknown
      - unavailable

variables:
  notify_device: !input notify_device
  minimum_magnitude: !input minimum_magnitude
  magnitude: "{{ trigger.to_state.attributes.magnitude }}"
  place: "{{ trigger.to_state.attributes.place }}"
  depth_km: "{{ trigger.to_state.attributes.depth_km }}"
  distance_km: "{{ trigger.to_state.attributes.distance_km }}"
  when: "{{ trigger.to_state.state | as_datetime | as_local }}"
  message: >-
    Earthquake M {{ magnitude }} near {{ place }}, {{ distance_km }} km away,
    depth {{ depth_km }} km, at {{ when.strftime('%H:%M') if when else '?' }}.

conditions:
  # A new event, not an attribute refresh of the same one, and strong enough.
  - condition: template
    value_template: "{{ trigger.from_state is none or trigger.from_state.state != trigger.to_state.state }}"
  - condition: template
    value_template: "{{ magnitude is not none and (magnitude | float(0)) >= (minimum_magnitude | float(0)) }}"

actions:
  - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
    data:
      title: "Earthquake M {{ magnitude }}"
      message: "{{ message }}"
  - sequence: !input extra_actions
